server {
    listen 80;
    server_name files.fifa-on.com;

    root /srv/files;

    # 레포에 심볼릭 링크가 섞여 들어와도 링크 대상 서빙 금지
    disable_symlinks on;

    # 파일명 버저닝 전제(같은 이름 덮어쓰기 금지) — 영구 캐시
    add_header Cache-Control "public, max-age=31536000, immutable";
    # 공개 정적 에셋 CORS 허용 (fifa-on.com 오리진의 fetch / 이미지 캡처용)
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options "nosniff";
    # 파일을 브라우저에서 직접 열어도 스크립트 실행 봉쇄(svg/html류 방어).
    # <img>/fetch 임베드에는 영향 없음 — 문서로 열람될 때만 적용됨.
    add_header Content-Security-Policy "script-src 'none'" always;

    # 디렉토리 리스팅 금지, 정확한 파일만 서빙
    autoindex off;
    location / {
        try_files $uri =404;
    }

    # 데이터 파일(patchnote.json 등): 제자리 수정 전제라 짧은 캐시 + fetch()용 CORS.
    # 🔴 이 location 이 없으면 위의 1년 immutable 캐시에 걸려 고쳐 push 해도 화면이 영영 안 바뀐다.
    location /data/ {
        add_header Cache-Control "public, max-age=60";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "script-src 'none'" always;
        try_files $uri =404;
    }

    # 레포 메타·인프라 설정은 서빙 대상 아님
    location ^~ /deploy/ {
        return 404;
    }
    location = /README.md {
        return 404;
    }

    # .git 등 숨김 경로 차단 (checkout을 그대로 마운트하므로 필수)
    location ~ /\. {
        return 404;
    }

    # 헬스체크용
    location = /healthz {
        add_header Cache-Control "no-store";
        return 200 "ok";
    }
}
